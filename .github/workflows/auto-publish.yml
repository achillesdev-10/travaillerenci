name: TravaillerEnCi — Publication & purge automatiques

on:
  schedule:
    # Toutes les 15 minutes : maintient la règle « publication automatique
    # après 21 minutes » même quand l'admin ne se connecte pas.
    - cron: '*/15 * * * *'
  workflow_dispatch: # Déclenchement manuel depuis l'onglet Actions

jobs:
  auto-moderation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then
            pip install -r scraper/requirements.txt
          fi

      - name: Maintenance automatique des offres (publication ≥ 21 min + purge > 21 jours)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scraper/scraper.py --maintenance-only

      - name: Maintenance automatique des concours (publication ≥ 21 min + purge > 5 semaines)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Module concours (table exams) : même règle d'auto-publication que les
          # offres — les concours en pending depuis ≥ 21 min sont publiés pour que
          # /concours ne reste jamais vide faute de modération manuelle.
          python scraper/exams_runner.py --maintenance-only

      - name: Nettoyage des fiches concours hors-sujet (titres de rubrique / sans info exploitable)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Filet de sécurité périodique : rejette (status='rejected', réversible
          # dans /admin/exams → Rejetés) les fiches concours qui ne décrivent pas
          # une annonce exploitable — rubriques (« Communiqués », « Actu … »,
          # « Archives… », « Note aux usagers »…), pages institutionnelles ou
          # fiches sans date ni condition. Les nouvelles fiches sont déjà filtrées
          # au scraping (relevance_issues) ; cette étape repasse sur l'existant.
          python scraper/exams_runner.py --cleanup-noise --apply

      # ==========================================================================
      # Alertes candidat : après chaque cycle d'auto-publication, on compare les
      # contenus nouvellement publiés aux alertes actives et on envoie une
      # notification GROUPÉE (email Resend + WhatsApp Meta Cloud API).
      # Déduplication via alert_digest_log — chaque (alerte, élément) n'est
      # notifié qu'une seule fois. Sans RESEND_API_KEY ni WhatsApp, le script
      # ne fait que journaliser (aucun impact sur le cycle de publication).
      # ==========================================================================
      - name: Notifications alertes candidat (nouveaux contenus publiés)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          WHATSAPP_NOTIFY_ENABLED: ${{ vars.WHATSAPP_NOTIFY_ENABLED }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          ALERT_DIGEST_LOOKBACK_HOURS: ${{ vars.ALERT_DIGEST_LOOKBACK_HOURS }}
        run: |
          python scraper/alert_digest.py
