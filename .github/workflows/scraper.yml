name: TravaillerEnCi CI (Scraper + Lint)

on:
  schedule:
    # Deux fois par jour : 06:00 et 18:00 UTC (= 06:00 & 18:00 GMT, 07:00 & 19:00 Abidjan)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Déclenchement manuel depuis l'onglet Actions
  push: # Vérification du code à chaque push (lint + typecheck)
  pull_request:

jobs:
  # ==========================================================================
  # Scraping automatisé — NE s'exécute que sur planification ou manuel.
  # Pas à chaque push : les sites sources ne doivent pas être sollicités en continu.
  # ==========================================================================
  scrape-content:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Timeout de sécurité : avec le circuit breaker sur quota IA, un run
    # complet ne devrait jamais dépasser ~15 min. 30 min = filet de sécurité
    # pour éviter qu'un run bloqué tourne inutilement longtemps.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then
            pip install -r scraper/requirements.txt
          fi

      - name: Run unit tests (BEFORE scraping — catch bugs avant d'appeler les APIs)
        run: |
          set -euo pipefail
          python scraper/tests/test_exam_parser.py
          python scraper/tests/test_similarity_check.py
          python scraper/tests/test_exam_repository.py
          python scraper/tests/test_repository_maintenance.py
          python scraper/tests/test_exam_sources.py
          python scraper/tests/test_exam_relevance.py
          python scraper/tests/test_alert_digest.py
          python scraper/tests/test_ai_fallback.py
          python scraper/tests/test_source_health.py
          python scraper/tests/test_exam_merge.py

      - name: Run scraper (collecte + réécriture IA + modération pending)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Clé Google AI Studio (https://aistudio.google.com/apikey) :
          # classification + réécriture Markdown des contenus via Gemini.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Repli IA (https://console.groq.com/keys) : si Gemini échoue (quota,
          # timeout, JSON invalide, réponse inexploitable), Groq prend le relais
          # avant les heuristiques locales. Optionnel mais fortement recommandé.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCRAPER_SITES: ${{ vars.SCRAPER_SITES }}
          # Timeout de sécurité au niveau du run Python (secondes).
          # Circuit breaker + timeout ensemble garantissent un arrêt propre.
          SCRAPER_MAX_DURATION_SECONDS: 900
        run: |
          set -euo pipefail
          # SCRAPER_SITES (variable de repo) est optionnelle : défaut = educarriere,emploici,boursedetude
          python scraper/scraper.py --max-per-site 15 ${SCRAPER_SITES:+--sites "$SCRAPER_SITES"}

      - name: Run exam scraper (module Concours — sources officielles)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Repli IA (https://console.groq.com/keys) : même rôle que pour le
          # scraper de contenus — Gemini d'abord, Groq si échec, heuristiques
          # locales en dernier recours.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EXAM_SOURCES: ${{ vars.EXAM_SOURCES }}
          # Timeout de sécurité au niveau du run Python (secondes).
          SCRAPER_MAX_DURATION_SECONDS: 900
        run: |
          set -euo pipefail
          # EXAM_SOURCES (variable de repo) optionnelle : filtre les sources
          # (ex: gucaci,ena,infas). Défaut = toutes les sources activées.
          python scraper/exams_runner.py --max-per-source 10 ${EXAM_SOURCES:+--sources "$EXAM_SOURCES"}

  # ==========================================================================
  # Vérification du code front (Next.js) à chaque push / PR :
  #   • ESLint (flat config, eslint.config.mjs)
  #   • TypeScript strict (tsc --noEmit)
  # ==========================================================================
  lint-and-typecheck:
    runs-on: ubuntu-latest

    # Annule les runs de lint précédents sur la même branche lors de pushes
    # rapides et successifs (économise les minutes Actions).
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Unit tests (phase concours)
        run: npm run test:exam-phase
