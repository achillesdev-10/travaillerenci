<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Recherche d'emploi en Côte d'Ivoire</title>
  <desc id="heroDesc">Illustration de la plateforme TravaillerenCi : une carte d'offre d'emploi vérifiée, une mallette et un pin de localisation à Abidjan.</desc>

  <defs>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#1e4db3"/>
    </linearGradient>
    <linearGradient id="gradCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff4e9"/>
    </linearGradient>
    <linearGradient id="gradBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#003087" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1f2e" flood-opacity="0.14"/>
    </filter>
    <filter id="tinyShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a1f2e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Blob d'arrière-plan -->
  <ellipse cx="282" cy="252" rx="238" ry="206" fill="url(#gradBlob)"/>
  <ellipse cx="120" cy="80" rx="90" ry="60" fill="#c2410c" opacity="0.05"/>
  <ellipse cx="470" cy="420" rx="110" ry="70" fill="#003087" opacity="0.05"/>

  <!-- Points décoratifs -->
  <g opacity="0.5">
    <circle cx="78" cy="150" r="5" fill="#c2410c"/>
    <circle cx="492" cy="120" r="4" fill="#003087"/>
    <circle cx="452" cy="84" r="6" fill="#c2410c" opacity="0.35"/>
    <circle cx="98" cy="360" r="4" fill="#003087" opacity="0.35"/>
  </g>

  <!-- ===== Carte d'offre principale ===== -->
  <g filter="url(#softShadow)">
    <rect x="120" y="150" width="320" height="200" rx="22" fill="url(#gradCard)" stroke="#e2ece4"/>
    <!-- Barre de l'offre -->
    <rect x="150" y="180" width="70" height="10" rx="5" fill="#c2410c" opacity="0.85"/>
    <rect x="150" y="202" width="180" height="14" rx="7" fill="#1c2b3a" opacity="0.85"/>
    <rect x="150" y="224" width="120" height="10" rx="5" fill="#94a3b8"/>
    <!-- Lignes de description -->
    <rect x="150" y="252" width="250" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="150" y="268" width="210" height="8" rx="4" fill="#cbd5e1"/>
    <!-- Badges -->
    <rect x="150" y="292" width="64" height="24" rx="12" fill="#c2410c" opacity="0.12"/>
    <text x="182" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">CDI</text>
    <rect x="226" y="292" width="84" height="24" rx="12" fill="#003087" opacity="0.10"/>
    <text x="268" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#003087">Abidjan</text>
    <!-- Bouton Postuler -->
    <rect x="150" y="328" width="110" height="34" rx="17" fill="url(#gradGreen)"/>
    <text x="205" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Postuler</text>
    <!-- Coche vérifiée -->
    <circle cx="418" cy="180" r="18" fill="url(#gradGreen)"/>
    <path d="M411 180 l5 5 l10 -10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Mini carte photo (haut gauche) ===== -->
  <g filter="url(#tinyShadow)">
    <rect x="52" y="96" width="150" height="88" rx="16" fill="#ffffff" stroke="#e2ece4"/>
    <circle cx="86" cy="128" r="16" fill="url(#gradBlue)" opacity="0.85"/>
    <rect x="112" y="120" width="70" height="8" rx="4" fill="#1c2b3a" opacity="0.8"/>
    <rect x="112" y="136" width="50" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="72" y="158" width="108" height="8" rx="4" fill="#e2ece4"/>
  </g>

  <!-- ===== Mallette (droite) ===== -->
  <g filter="url(#tinyShadow)">
    <g transform="translate(418 300)">
      <rect x="0" y="22" width="110" height="84" rx="14" fill="url(#gradBlue)"/>
      <rect x="30" y="0" width="50" height="30" rx="10" fill="#1e4db3"/>
      <rect x="30" y="12" width="50" height="18" rx="9" fill="#003087"/>
      <path d="M0 60 h110" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
      <circle cx="55" cy="70" r="9" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- ===== Pin de localisation + sparkles ===== -->
  <g filter="url(#tinyShadow)">
    <circle cx="330" cy="96" r="30" fill="#ffffff" stroke="#e2ece4"/>
    <path d="M330 76c-8.5 0-15 6.4-15 14.6 0 10 15 22 15 22s15-12 15-22c0-8.2-6.5-14.6-15-14.6z" fill="#c2410c"/>
    <circle cx="330" cy="91" r="5.5" fill="#ffffff"/>
  </g>
  <path d="M452 210 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#f59e0b" opacity="0.9"/>
  <path d="M96 236 l2.5 6.5 6.5 2.5 -6.5 2.5 -2.5 6.5 -2.5 -6.5 -6.5 -2.5 6.5 -2.5 z" fill="#c2410c" opacity="0.55"/>

  <!-- ===== Étoile + note positive ===== -->
  <g filter="url(#tinyShadow)">
    <rect x="52" y="330" width="120" height="56" rx="16" fill="#ffffff" stroke="#e2ece4"/>
    <path d="M70 358 l4 8 9 1.2 -6.5 6.2 1.6 9 -8.1 -4.3 -8.1 4.3 1.6 -9 -6.5 -6.2 9 -1.2 z" fill="#f59e0b"/>
    <rect x="94" y="346" width="66" height="9" rx="4.5" fill="#1c2b3a" opacity="0.8"/>
    <rect x="94" y="364" width="52" height="8" rx="4" fill="#94a3b8"/>
  </g>
</svg>
