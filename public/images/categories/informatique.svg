<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="120" r="180" fill="#fff" opacity="0.06"/>
  <circle cx="200" cy="520" r="140" fill="#fff" opacity="0.06"/>
  <!-- Code brackets -->
  <text x="600" y="380" font-family="monospace" font-size="180" font-weight="700" fill="#fff" opacity="0.2" text-anchor="middle">&lt;/&gt;</text>
  <!-- Monitor icon -->
  <rect x="420" y="180" width="360" height="240" rx="12" fill="#fff" opacity="0.15"/>
  <rect x="440" y="200" width="320" height="180" rx="6" fill="#fff" opacity="0.1"/>
  <rect x="540" y="420" width="120" height="20" rx="4" fill="#fff" opacity="0.12"/>
  <rect x="500" y="440" width="200" height="10" rx="4" fill="#fff" opacity="0.1"/>
  <!-- Terminal cursor -->
  <rect x="470" y="240" width="4" height="24" fill="#34d399" opacity="0.6"/>
  <text x="490" y="260" font-family="monospace" font-size="18" fill="#34d399" opacity="0.5">$ _</text>
  <text x="600" y="560" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.7">IT / Digital</text>
</svg>