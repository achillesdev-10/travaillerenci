<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="110" r="180" fill="#fff" opacity="0.05"/>
  <circle cx="200" cy="510" r="150" fill="#fff" opacity="0.05"/>
  <!-- Signal waves -->
  <circle cx="600" cy="280" r="30" fill="#fff" opacity="0.25"/>
  <circle cx="600" cy="280" r="70" fill="none" stroke="#fff" stroke-width="3" opacity="0.18"/>
  <circle cx="600" cy="280" r="110" fill="none" stroke="#fff" stroke-width="3" opacity="0.14"/>
  <circle cx="600" cy="280" r="150" fill="none" stroke="#fff" stroke-width="3" opacity="0.1"/>
  <circle cx="600" cy="280" r="190" fill="none" stroke="#fff" stroke-width="2" opacity="0.07"/>
  <!-- Tower base -->
  <rect x="590" y="320" width="20" height="100" fill="#fff" opacity="0.2"/>
  <polygon points="560,420 640,420 610,320 590,320" fill="#fff" opacity="0.15"/>
  <!-- Phone icon -->
  <rect x="560" y="460" width="80" height="50" rx="8" fill="#fff" opacity="0.12"/>
  <circle cx="600" cy="495" r="4" fill="#fff" opacity="0.15"/>
  <text x="600" y="560" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.7">Télécommunications</text>
</svg>