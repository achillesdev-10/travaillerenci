<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="120" r="180" fill="#fff" opacity="0.05"/>
  <circle cx="200" cy="520" r="140" fill="#fff" opacity="0.05"/>
  <!-- Road -->
  <rect x="0" y="400" width="1200" height="80" fill="#fff" opacity="0.08"/>
  <line x1="100" y1="440" x2="250" y2="440" stroke="#fff" stroke-width="4" stroke-dasharray="30 20" opacity="0.2"/>
  <line x1="350" y1="440" x2="500" y2="440" stroke="#fff" stroke-width="4" stroke-dasharray="30 20" opacity="0.2"/>
  <line x1="600" y1="440" x2="750" y2="440" stroke="#fff" stroke-width="4" stroke-dasharray="30 20" opacity="0.2"/>
  <line x1="850" y1="440" x2="1000" y2="440" stroke="#fff" stroke-width="4" stroke-dasharray="30 20" opacity="0.2"/>
  <!-- Truck -->
  <rect x="400" y="330" width="200" height="80" rx="8" fill="#fff" opacity="0.18"/>
  <rect x="600" y="350" width="100" height="60" rx="6" fill="#fff" opacity="0.15"/>
  <circle cx="450" cy="420" r="18" fill="#fff" opacity="0.2"/>
  <circle cx="450" cy="420" r="8" fill="#374151" opacity="0.3"/>
  <circle cx="650" cy="420" r="18" fill="#fff" opacity="0.2"/>
  <circle cx="650" cy="420" r="8" fill="#374151" opacity="0.3"/>
  <!-- Package -->
  <rect x="430" y="290" width="40" height="40" rx="4" fill="#fbbf24" opacity="0.3"/>
  <line x1="430" y1="310" x2="470" y2="310" stroke="#fff" stroke-width="1.5" opacity="0.2"/>
  <line x1="450" y1="290" x2="450" y2="330" stroke="#fff" stroke-width="1.5" opacity="0.2"/>
  <text x="600" y="560" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.7">Transport / Logistique</text>
</svg>