  <rect x="480" y="140" width="40" height="80" rx="4" fill="#fff" opacity="0.15"/>
  <rect x="560" y="100" width="40" height="120" rx="4" fill="#fff" opacity="0.2"/>
  <!-- Windows -->
  <rect x="380" y="260" width="60" height="40" rx="3" fill="#fff" opacity="0.15"/>
  <rect x="480" y="260" width="60" height="40" rx="3" fill="#fff" opacity="0.15"/>
  <rect x="580" y="260" width="60" height="40" rx="3" fill="#fff" opacity="0.15"/>
  <rect x="680" y="260" width="60" height="40" rx="3" fill="#fff" opacity="0.15"/>
  <!-- Gear -->
  <circle cx="750" cy="400" r="40" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.25"/>
  <circle cx="750" cy="400" r="20" fill="#fbbf24" opacity="0.15"/>
  <text x="600" y="560" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.7">Industrie</text>
