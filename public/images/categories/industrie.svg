  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="90" r="200" fill="#fff" opacity="0.04"/>
  <circle cx="200" cy="540" r="160" fill="#fff" opacity="0.04"/>
  <!-- Factory building -->
